[project]
name = "jarvisd"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "websockets>=14.0",
    "httpx>=0.27",
    "brain",
]

[tool.uv.sources]
brain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvisd"]
