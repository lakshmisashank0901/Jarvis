[project]
name = "jarvis"
version = "0.1.0"
description = "Local voice-first workshop assistant"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv.workspace]
members = ["brain", "jarvisd", "mcp", "memory"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["brain/tests", "memory/tests", "jarvisd/tests", "mcp/tests", "bench"]
pythonpath = ["brain", "memory", "jarvisd", "mcp", "bench"]

[tool.uv]
package = false

[tool.uv.sources]
brain = { workspace = true }
jarvisd = { workspace = true }
jarvis-mcp = { workspace = true }
memory = { workspace = true }
