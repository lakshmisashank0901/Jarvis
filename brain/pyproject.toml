[project]
name = "brain"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "memory",
    "jarvis-mcp",
    "mlx-lm>=0.31.3",
]

[tool.uv.sources]
memory = { workspace = true }
jarvis-mcp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain"]
